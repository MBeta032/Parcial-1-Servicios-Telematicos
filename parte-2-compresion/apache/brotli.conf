<IfModule mod_brotli.c>

    # Calidad: 0 (rapido) a 11 (maximo)
    BrotliCompressionQuality 11

    # Ventana de busqueda: 2^22 = 4 MB de historial
    BrotliCompressionWindow 22

    # Mismos tipos de texto que mod_deflate
    AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css \
        text/javascript application/javascript application/json \
        application/xml application/xhtml+xml image/svg+xml

    # Excluir binarios ya comprimidos
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|mp4|avi|zip|gz|pdf)$ \
        no-brotli dont-vary

</IfModule>
