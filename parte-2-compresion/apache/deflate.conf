<IfModule mod_deflate.c>

    # Nivel de compresion: 1 (rapido) a 9 (maximo). Por defecto 6.
    DeflateCompressionLevel 6

    # Comprimir solo contenido de TEXTO
      AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css \
       text/javascript application/javascript application/json \
       application/xml application/xhtml+xml image/svg+xml

    # Excluir binarios YA comprimidos: comprimirlos gasta CPU y no ahorra nada
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|mp4|avi|zip|gz|pdf)$ \
        no-gzip dont-vary

    # Registrar el ratio de compresion en un log propio
    DeflateFilterNote Input  instream
    DeflateFilterNote Output outstream
    DeflateFilterNote Ratio  ratio
    LogFormat '"%r" %{outstream}n/%{instream}n (%{ratio}n%%)' deflate_log
    CustomLog ${APACHE_LOG_DIR}/deflate.log deflate_log

</IfModule>
