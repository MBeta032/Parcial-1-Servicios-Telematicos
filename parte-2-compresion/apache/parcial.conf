<VirtualHost *:80>
    ServerName parcial.empresa.local
    DocumentRoot /var/www/parcial

    <Directory /var/www/parcial>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    CustomLog ${APACHE_LOG_DIR}/deflate.log deflate_log
    ErrorLog  ${APACHE_LOG_DIR}/parcial_error.log
    CustomLog ${APACHE_LOG_DIR}/parcial_access.log combined
</VirtualHost>
